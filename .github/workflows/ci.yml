name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # PR runs share a group per branch, so a new push cancels the superseded
  # run. Master runs are grouped per commit: GitHub keeps only one pending
  # run per group, so a shared group would drop queued merge commits.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the Vercel project's Node.js version (24.x).
          node-version: 24
          cache: npm
      - id: install
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Gating: a syntax error in the lint runner would otherwise exit 1 and
      # look like ordinary lint findings in the advisory step below.
      - run: node --check scripts/ci-lint.mjs

      # Lint is advisory until the existing findings are cleaned up: it may
      # fail without failing the job. To make it gating, remove this
      # continue-on-error AND eslint.ignoreDuringBuilds in next.config.ts
      # together. It runs whenever the install succeeded (also after a
      # failed typecheck or test), using the project's own ESLint.
      - name: Lint (advisory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/ci-lint.mjs
