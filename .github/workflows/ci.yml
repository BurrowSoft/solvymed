name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # PR runs share a group per branch, so a new push cancels the superseded
  # run. Master runs are grouped per commit: GitHub keeps only one pending
  # run per group, so a shared group would drop queued merge commits.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the Vercel project's Node.js version (24.x).
          node-version: 24
          cache: npm
      - id: install
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Lint is advisory: scripts/ci-lint.mjs reports findings (annotations
      # and a job-summary total) and exits 0; it fails only when the runner
      # itself crashes, so a crash is never mistaken for findings.
      - name: Lint (advisory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci-lint.mjs
