name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; master runs never are, so every merge
  # commit gets its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the Vercel project's Node.js version (24.x).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Lint is advisory until the existing findings are cleaned up: it may
      # fail without failing the job. To make it gating, remove this
      # continue-on-error AND eslint.ignoreDuringBuilds in next.config.ts
      # together. GitHub shows only ~10 errors + 10 warnings as annotations,
      # so the totals go to the job summary.
      - name: Lint (advisory)
        if: always()
        continue-on-error: true
        run: |
          npx eslint . -f json -o eslint-report.json || true
          node -e '
            const r = require("./eslint-report.json");
            const e = r.reduce((n, f) => n + f.errorCount, 0);
            const w = r.reduce((n, f) => n + f.warningCount, 0);
            const s = `### Lint (advisory)\n\n${e} errors, ${w} warnings\n`;
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, s);
            console.log(s);
          '
          npm run lint
